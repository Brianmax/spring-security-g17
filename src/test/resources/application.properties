security.jwt.issuer=virtual-banking-api-test
security.jwt.audience=virtual-banking-clients-test
security.jwt.access-token-ttl=15m
security.jwt.refresh-token-ttl=7d
security.jwt.clock-skew=30s
security.jwt.generate-ephemeral-key=true
security.password.bcrypt-strength=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
